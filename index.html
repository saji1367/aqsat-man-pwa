function calc(a){const st=[a.sy,a.sm,a.sd],tot=a.amount*a.count,pd=a.amount*a.paid,next=a.paid<a.count?addM(st,a.paid):null;let s=['تمام‌شده','#10b981'];if(next)s=key(next)<key(today)?['معوق','#ef4444']:(next[0]===today[0]&&next[1]===today[1])?['سررسید این ماه','#f59e0b']:['در جریان','#5b5bf0'];return{tot,pd,un:tot-pd,pct:a.count?a.paid/a.count*100:0,end:addM(st,a.count-1),next,s}}
function ring(p,sz,sw,tr,st){const r=(sz-sw)/2,c=2*Math.PI*r,h=sz/2;return`<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}"><circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="${tr}" stroke-width="${sw}"/><circle class="arc" data-o="${c*(1-p/100)}" cx="${h}" cy="${h}" r="${r}" fill="none" stroke="${st}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c}" transform="rotate(-90 ${h} ${h})"/></svg>`}
function donut(pd,un){const r=62,c=2*Math.PI*r,a=c*pd/((pd+un)||1);return`<svg class="donut" width="150" height="150" viewBox="0 0 150 150"><circle cx="75" cy="75" r="${r}" fill="none" stroke="#f59e0b" stroke-width="22"/><circle cx="75" cy="75" r="${r}" fill="none" stroke="#10b981" stroke-width="22" stroke-dasharray="${a} ${c}" transform="rotate(-90 75 75)"/></svg>`}
function totals(){let t=0,p=0,n=0,pc=0;S.forEach(a=>{t+=a.amount*a.count;p+=a.amount*a.paid;n+=a.count;pc+=a.paid});return{t,p,u:t-p,pct:t?p/t*100:0}}
function bars(){const m={},t0=today[0]*12+today[1]-1;S.forEach(a=>{for(let i=a.paid;i<a.count;i++){const d=addM([a.sy,a.sm,a.sd],i),k=Math.max(t0,d[0]*12+d[1]-1);m[k]=(m[k]||0)+a.amount}});const arr=[0,1,2,3,4,5].map(i=>[t0+i,m[t0+i]||0]),mx=Math.max(...arr.map(x=>x[1]),1);return arr.map((x,i)=>`<div class="bar" style="--k:${i}"><span>${x[1]?money(x[1]/1e6)+' م':'—'}</span><i style="height:${Math.max(x[1]/mx*100,4)*.72}%"></i><span>${MN[x[0]%12]}</span></div>`).join('')}
function currentMonthDue(){return S.map(a=>({a:a,c:calc(a)})).filter(x=>x.c.next&&x.c.next[0]===today[0]&&x.c.next[1]===today[1]).sort((x,y)=>key(x.c.next)-key(y.c.next))}
function home(){
 const T=totals(),due=currentMonthDue();
 const hero='<div class="card hero" style="--i:0"><div class="hrow"><div class="gauge">'+ring(T.pct,132,13,'rgba(100,125,180,.16)','#7898ed')+'<div class="mid"><span class="cu" data-n="'+T.pct+'" data-f="p">۰</span><small>پرداخت‌شده</small></div></div><div class="stats"><div class="stat"><small>جمع کل اقساط</small><b><span class="cu" data-n="'+T.t+'" style="font-size:inherit;opacity:1;margin:0">۰</span><span>تومان</span></b></div><div class="stat"><small>پرداخت‌شده</small><b><span class="cu" data-n="'+T.p+'" style="font-size:inherit;opacity:1;margin:0">۰</span><span>تومان</span></b></div><div class="stat"><small>پرداخت‌نشده</small><b><span class="cu" data-n="'+T.u+'" style="font-size:inherit;opacity:1;margin:0">۰</span><span>تومان</span></b></div></div></div></div>';
 const dueHtml=due.length?'<div class="due-list">'+due.map((x,i)=>'<div class="due-item" style="--i:'+i+'"><div class="due-icon">'+ic('wallet',21)+'</div><div class="due-info"><b>'+esc(x.a.name)+'</b><small>'+fmt(x.c.next)+' · '+money(x.a.amount)+' تومان</small></div><button class="btn due-pay" data-a="pay" data-id="'+x.a.id+'">'+ic('check',15)+'پرداخت</button></div>').join('')+'</div>':'<div class="empty" style="padding:20px 8px">'+ic('check',30)+'<p style="margin-top:6px">برای این ماه قسط پرداخت‌نشده‌ای باقی نمانده است.</p></div>';
 $('#v-home').innerHTML=hero+'<div class="card" style="--i:1"><h2>'+ic('cal')+'اقساط پرداخت‌نشده این ماه</h2>'+dueHtml+'</div><div class="card" style="--i:2"><h2>'+ic('pie')+'سهم پرداخت‌شده و باقی‌مانده</h2><div class="dn">'+donut(T.p,T.u)+'<div class="leg"><div><i style="background:#67c9a5"></i>پرداخت‌شده<b>'+money(T.p)+'</b></div><div><i style="background:#f2c879"></i>پرداخت‌نشده<b>'+money(T.u)+'</b></div></div></div></div>';
}
function list(){const L=S.filter(a=>F==='all'||(F==='done')===(a.paid>=a.count));
$('#v-list').innerHTML=`<div class="tabs">${[['all','همه'],['act','در حال پرداخت'],['done','تمام‌شده']].map(x=>`<button data-f="${x[0]}" class="${F===x[0]?'on':''}">${x[1]}</button>`).join('')}</div>`+(L.length?L.map((a,i)=>{const c=calc(a),col=a.paid>=a.count?'#10b981':'url(#gr)';return`<div class="card item" style="--i:${i}"><div class="ih"><div class="mini">${ring(c.pct,58,7,'var(--line)',col)}<span>${fd(Math.round(c.pct))}٪</span></div><div class="t"><b>${esc(a.name)}</b><span class="chip" style="--c:${c.s[1]}">${c.s[0]}</span></div></div>
<div class="dates"><span>${ic('cal',15)}شروع: ${fmt([a.sy,a.sm,a.sd])}</span><span>پایان: ${fmt(c.end)}</span></div><div class="due-line">${ic('cal',15)}${c.next?'قسط بعدی: '+fmt(c.next):'تمام اقساط پرداخت شده است'}</div>
<div class="pb"><i data-w="${c.pct}"></i></div>
<div class="dates" style="margin:8px 0 0"><span>پرداخت‌شده: ${fd(a.paid)} قسط</span><span>مانده: ${fd(a.count-a.paid)} قسط</span></div>
<div class="sums"><div class="p">جمع پرداخت‌شده<b>${money(c.pd)}</b></div><div class="u">جمع پرداخت‌نشده<b>${money(c.un)}</b></div></div>
<div class="acts"><button class="btn" data-a="pay" data-id="${a.id}" ${a.paid>=a.count?'disabled style="opacity:.5"':''}>${ic('check',18)}ثبت پرداخت این ماه</button><button class="sm" data-a="undo" data-id="${a.id}" aria-label="برگرداندن">${ic('undo',18)}</button><button class="sm" data-a="edit" data-id="${a.id}" aria-label="ویرایش">${ic('edit',18)}</button><button class="sm d" data-a="del" data-id="${a.id}" aria-label="حذف">${ic('trash',18)}</button></div></div>`}).join(''):`<div class="empty">${ic('wallet',40)}<p style="margin-top:8px">قسطی اینجا نیست. با دکمه‌ی + اولین قسط را اضافه کن.</p></div>`)}
function sett(){const th=ld('aghsat.theme')||'auto';$('#v-set').innerHTML=`<div class="card" style="--i:0"><h2>${ic('spark')}تنظیمات</h2><div class="row"><div>پوسته<small>روشن، تیره یا طبق سیستم</small></div><div class="seg">${[['light','روشن'],['dark','تیره'],['auto','خودکار']].map(x=>`<button data-t="${x[0]}" class="${th===x[0]?'on':''}">${x[1]}</button>`).join('')}</div></div>
<div class="row"><div>پشتیبان‌گیری<small>داده‌ها فقط روی همین دستگاه ذخیره می‌شوند</small></div><button class="sm" data-a="bk" aria-label="پشتیبان">${ic('copy',18)}</button></div>
<div class="row"><div>بازیابی از پشتیبان<small>متن پشتیبان را جای‌گذاری کن</small></div><button class="sm" data-a="rs" aria-label="بازیابی">${ic('undo',18)}</button></div>
<div class="row"><div>نصب روی گوشی<small>آیفون و اندروید</small></div><button class="sm" data-a="ins" aria-label="نصب">${ic('phone',18)}</button></div></div><div class="credit"><span class="hb">${ic('heart',22)}</span><p>طراحی و توسعه داده شده با</p><b>سجاد درویشی</b><a href="https://www.sajaddarvishi.ir" target="_blank" rel="noopener">${ic('globe',16)}www.sajaddarvishi.ir</a></div>`}
function anim(){requestAnimationFrame(()=>requestAnimationFrame(()=>{document.querySelectorAll('.arc').forEach(a=>a.style.strokeDashoffset=a.dataset.o);document.querySelectorAll('.pb i').forEach(i=>i.style.width=i.dataset.w+'%')}));const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;document.querySelectorAll('.cu').forEach(e=>{const n=+e.dataset.n,p=e.dataset.f==='p',f=v=>p?fd(Math.round(v))+'٪':money(v);if(rm){e.textContent=f(n);return}const t0=performance.now();(function s(t){const k=Math.min((t-t0)/1100,1);e.textContent=f(n*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(s)})(t0)})}
function render(){home();list();sett();anim()}
function show(v){V=v;document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+v));document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));$('#fab').style.display=v==='set'?'none':'grid';scrollTo(0,0);render()}
function toast(t){const e=$('#ts');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}
function burst(el){const r=el.getBoundingClientRect();for(let i=0;i<16;i++){const s=document.createElement('i');s.className='cf';s.style.cssText=`left:${r.left+r.width/2}px;top:${r.top}px;--dx:${(Math.random()-.5)*220}px;--dy:${-70-Math.random()*120}px;background:hsl(${Math.random()*360} 80% 60%)`;document.body.appendChild(s);setTimeout(()=>s.remove(),950)}}
const open=h=>{$('#sh').innerHTML=h;$('#md').classList.add('on')},close=()=>{$('#md').classList.remove('on');document.activeElement?.blur?.()};
function form(id){const a=S.find(x=>x.id===id)||{name:'',amount:'',count:'',paid:0,sy:today[0],sm:today[1],sd:today[2]};
open(`<h3>${id?'ویرایش قسط':'قسط جدید'}</h3><label>نام قسط</label><input id="f_n" value="${esc(a.name)}" placeholder="مثلاً وام خودرو"><div class="g2"><div><label>مبلغ هر قسط (تومان)</label><input id="f_a" data-fa-number inputmode="numeric" value="${a.amount?fd(a.amount):''}"></div><div><label>تعداد کل اقساط</label><input id="f_c" data-fa-number inputmode="numeric" value="${a.count?fd(a.count):''}"></div></div><label>تاریخ شروع (شمسی)</label><div class="g3"><input id="f_d" data-fa-number inputmode="numeric" value="${fd(a.sd)}" aria-label="روز"><select id="f_m" aria-label="ماه">${MN.map((m,i)=>`<option value="${i+1}" ${i+1===a.sm?'selected':''}>${m}</option>`).join('')}</select><input id="f_y" data-fa-number inputmode="numeric" value="${fd(a.sy)}" aria-label="سال"></div><label>تعداد قسط پرداخت‌شده</label><input id="f_p" data-fa-number inputmode="numeric" value="${fd(a.paid)}"><button class="btn" id="f_s">${ic('check',18)}ذخیره</button>`);
bindFaInputs($('#sh'));
$('#f_s').onclick=()=>{const o={id:id||Date.now(),name:$('#f_n').value.trim(),amount:+en($('#f_a').value),count:+en($('#f_c').value),paid:+en($('#f_p').value||0),sy:+en($('#f_y').value),sm:+$('#f_m').value,sd:Math.min(Math.max(+en($('#f_d').value),1),31)};if(!o.name||!o.amount||!o.count||!o.sy)return toast('نام، مبلغ، تعداد و سال شروع را کامل وارد کن');o.paid=Math.min(o.paid,o.count);id?S=S.map(x=>x.id===id?o:x):S.push(o);save();close();render();toast('قسط ذخیره شد')}}
function box(mode){open(`<h3>${mode==='bk'?'پشتیبان داده‌ها':'بازیابی از پشتیبان'}</h3><p style="color:var(--mu);font-size:13px">${mode==='bk'?'این متن را کپی و جایی امن نگه دار.':'متن پشتیبان را اینجا جای‌گذاری کن.'}</p><textarea id="bx">${mode==='bk'?esc(JSON.stringify(S)):''}</textarea><button class="btn" id="bb">${mode==='bk'?'کپی متن':'بازیابی'}</button>`);$('#bb').onclick=()=>{const t=$('#bx');if(mode==='bk'){t.select();try{navigator.clipboard.writeText(t.value)}catch(e){document.execCommand('copy')}toast('کپی شد')}else{try{const d=JSON.parse(t.value);if(!Array.isArray(d))throw 0;S=d;save();close();render();toast('بازیابی شد')}catch(e){toast('متن پشتیبان معتبر نیست')}}}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a],[data-f],[data-t],[data-v]');if(!b){if(e.target.id==='md')close();return}const d=b.dataset,a=S.find(x=>x.id==+d.id);
if(d.v)return show(d.v);if(d.f){F=d.f;return list(),anim()}if(d.t){sv('aghsat.theme',d.t);theme();return sett()}
if(d.a==='pay'&&a&&a.paid<a.count){a.paid++;save();render();burst(b);toast(a.paid>=a.count?'تبریک! این قسط تمام شد 🎉':'پرداخت ثبت شد')}
if(d.a==='undo'&&a&&a.paid>0){a.paid--;save();render();toast('یک پرداخت برگشت داده شد')}
if(d.a==='edit')form(a.id);if(d.a==='del'&&a)open(`<h3>حذف «${esc(a.name)}»؟</h3><p style="color:var(--mu)">این کار قابل بازگشت نیست.</p><button class="btn" id="yd" style="background:var(--bad)">${ic('trash',18)}حذف قسط</button>`),$('#yd').onclick=()=>{S=S.filter(x=>x.id!==a.id);save();close();render();toast('قسط حذف شد')};
if(d.a==='bk'||d.a==='rs')box(d.a);if(d.a==='ins')open(`<h3>نصب روی گوشی</h3><p style="line-height:2"><b>آیفون:</b> در Safari دکمه‌ی اشتراک‌گذاری را بزن، سپس «Add to Home Screen».<br><b>اندروید:</b> لینک را مستقیم در Chrome باز کن (نه داخل اپ‌ها)، منوی ⋮ را بزن و «Add to Home screen» را انتخاب کن؛ اگر گزینه‌ی «Install» دیدی همان را بزن.</p>`)});
function theme(){const t=ld('aghsat.theme')||'auto',r=document.documentElement;t==='auto'?r.removeAttribute('data-theme'):r.dataset.theme=t;const dk=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);$('#thm').innerHTML=ic(dk?'sun':'moon',20)}
$('#thm').onclick=()=>{const dk=document.documentElement.dataset.theme==='dark'||(!document.documentElement.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);sv('aghsat.theme',dk?'light':'dark');theme();sett()};
$('#ttl').innerHTML=ic('wallet',26)+'اقساط من';$('#fab').innerHTML=ic('plus',26);$('#fab').onclick=()=>form();
$('#nav').innerHTML=[['home','خانه'],['list','اقساط'],['set','تنظیمات']].map(x=>`<button data-v="${x[0]}" class="${x[0]==='home'?'on':''}">${ic(x[0],22)}${x[1]}</button>`).join('');

theme();render();
function syncViewport(){const vv=window.visualViewport;if(!vv)return;const kb=Math.max(0,window.innerHeight-vv.height-vv.offsetTop);document.documentElement.style.setProperty('--vvh',vv.height+'px');document.documentElement.style.setProperty('--kb',kb+'px');if(kb>100){const el=document.activeElement;if(el&&$('#md').classList.contains('on'))requestAnimationFrame(()=>el.scrollIntoView({block:'nearest',behavior:'smooth'}));}}
if(window.visualViewport){window.visualViewport.addEventListener('resize',syncViewport);window.visualViewport.addEventListener('scroll',syncViewport)}window.addEventListener('resize',syncViewport);syncViewport();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => console.warn('SW registration failed:', err));
  });
}
</script></body></html>
